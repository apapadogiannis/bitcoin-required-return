# The statements of llms.txt and of the header of outputs/results.json that are specific to this
# package. scripts/make_guide.py combines them with CITATION.cff and the results. No result of the
# paper is written here.

ssrn = "10.2139/ssrn.7705239"
data_as_of = "Cryptoasset data to 2026-05-24; the last required return in the monthly test is dated 2026-04-30. ETF prices, the euro/dollar rate, the Treasury yield and the option quotes run to November 2026."
units = "The headline list in outputs/results.json states the unit of each figure. The labels of the checks mostly do not: returns, rates, gaps and volatilities are in percent or percentage points a year, counts are whole numbers, betas, correlations and ratios are plain numbers. In the CSV files rates are fractions (0.18 is 18% a year)."
describe_as = "Papadogiannis (2026), \"Bitcoin's Required Return: Pricing a New Asset Beside Equities and Gold\", working paper, with its replication package."
what = "Code, data and stored results of a working paper that asks what return Bitcoin's holders should require for the market, concentration and mortality risk they carry (the MCM equation), tests the answer against delivered returns month by month, and takes a census of cryptoasset deaths. The manuscript is in paper/."
third_party = "The cryptoasset data in data/cmdata are an unmodified copy of the Coin Metrics community dataset, licensed CC BY-NC 4.0 (non-commercial use, with attribution). They keep that licence and are not covered by the licence above. ETF prices, the euro/dollar rate and the Treasury yield are from Yahoo Finance and are included for replication only."
results_file = "a `headline` list with the figures most often asked for, then every number the paper quotes that the code recomputes, as two lists of checks. `census_checks`: claim, computed value, the paper's figure. `model_checks`: the same with the tolerance, which reflects the rounding of the printed figure. The labels are the audit script's own short names (T4 is Table 4, S6 Section 6, A.7 Appendix A.7, MC the propagation of the input ranges, elite an asset ever in the top twenty, jump a sudden collapse); the README says which script and table each group belongs to."

coverage = [
  "The required return on Bitcoin at every month-end from January 2012 to the end of the data: lower edge, midpoint and upper edge of the band, with the inputs (outputs/required_band_monthly.csv).",
  "The monthly test: the required return against the return of the following month, by period (outputs/monthly_test.txt).",
  "The census: every cryptoasset in the Coin Metrics community dataset from 2010 to 24 May 2026, with birth, death, kind of death and size (outputs/panel_v3.csv; assets ever in the top twenty in outputs/elite_top20_curated.csv).",
  "The same equation for Ether and other cryptoassets, with equity indices and gold for comparison, and the table restated for a euro investor (outputs/cross_section_terms.txt, outputs/euro_table.txt).",
  "The robustness results of the appendices, one text file each in outputs/. The README lists which script writes which file and where it appears in the paper.",
]
adds = [
  "The death of an asset is not in any data feed. The census classifies each one by a stated rule (end of the feed, price collapse without recovery, volume collapse without recovery), treats ticker migrations as survivals, and enters the known sudden collapses at their public-record dates. The flags for every asset are in outputs/panel_v3.csv.",
  "The share of wealth that holders keep in Bitcoin, which drives the concentration term, is built from household surveys and documented fund and company holdings. The paper gives the sources; the construction is in scripts/22_pretty_figs.py and scripts/26_holder_weight.py.",
  "Dates are kept honest. A required return is dated at the month-end it is set and compared with the return of the following month.",
  "The input data are stored in the repository with a checksum for every Coin Metrics file. The upstream archive stopped updating on 24 May 2026, so this copy is its last state and the run needs no download.",
]
files = [
  "outputs/required_band_monthly.csv: one row per month-end: age, risk-free rate, volatility, beta, holder weight at both edges, the band and the age rule.",
  "outputs/panel_v3.csv: one row per asset: birth, last observation, the death flags and dates under each definition.",
  "outputs/*.txt: the result tables as printed for the paper. Use results.json to quote a number and these to see its table.",
  "paper/manuscript.pdf: the working paper.",
  "data/: all inputs. data/cmdata/MANIFEST.sha256 lists the checksums.",
]
read = [
  "A required return is what holders should require for the risk they carry. It is not a forecast of what Bitcoin will return.",
  "For the monthly path, quote the midpoint together with its band. The band is wide in the early years because the holder's weight was high and volatility extreme.",
  "In results.json `paper` is the figure as printed, usually rounded; `computed` is the value the code gives, at full precision where it is calculated and with the table's rounding where it is read from a printed table. Quote `paper` when citing the paper.",
  "A check whose claim is a statement and not a quantity has `paper` 1 and `computed` 1: read it as true.",
  "The paper's 2026 figure for Bitcoin is the median when the uncertain inputs are drawn across their ranges. The monthly band's midpoint (the T4 checks, required_band_monthly.csv, and the Crypto Observatory) averages the two edges of the band and stands about two points higher at the same date. They are different figures; say which one you quote.",
  "The many checks labelled as sensitivities (other weights, other premia, other windows, the crypto-wide back-cast) are robustness results, not the paper's headline.",
  "In required_band_monthly.csv rates are fractions a year, not percent.",
  "Realized averages over short periods have large standard errors, which outputs/monthly_test.txt reports beside each one.",
]
not_for = [
  "A forecast, a price target or a view on whether to hold Bitcoin.",
  "Anything after the paper's dates. The cryptoasset data end on 24 May 2026 and the package is not updated.",
  "Commercial reuse of the Coin Metrics data.",
  "The fate of a single asset. The census gives rates for groups of assets.",
]

[[headline]]
what = "Required return on Bitcoin for its current holders, 2026"
checks = "model_checks"
claim = "MC median"
low = "MC 90 lo"
high = "MC 90 hi"
range_is = "90% range of the input uncertainty"
unit = "percent a year, arithmetic average"
where = "Section 4 and Appendix D.1"

[[headline]]
what = "Monthly band for Bitcoin at the end of May 2026, midpoint"
checks = "model_checks"
claim = "T4 2026-05 midpoint"
low = "T4 2026-05 lower edge"
high = "T4 2026-05 upper (a)"
range_is = "band"
unit = "percent a year"
where = "Section 5, Table 4"

[[headline]]
what = "Required return on Ether for the average crypto owner"
checks = "model_checks"
claim = "S6 required Ether, average crypto owner (kappa 0.7)"
low = "S6 required Ether, average crypto owner (kappa 0.7) 5%"
high = "S6 required Ether, average crypto owner (kappa 0.7) 95%"
range_is = "90% range"
unit = "percent a year"
where = "Section 6, Table 6"

[[headline]]
what = "Delivered less required return at the midpoint, 2012 to 2026"
checks = "model_checks"
claim = "monthly all: gap mid"
se = "monthly all: se mid"
unit = "points a year, average of monthly returns"
where = "Section 5, Table 5"

[[headline]]
what = "Delivered less required return at the midpoint, 2018 to 2026"
checks = "model_checks"
claim = "monthly 2018-26: gap mid"
se = "monthly 2018-26: se mid"
unit = "points a year, average of monthly returns"
where = "Section 5, Table 5"

[[headline]]
what = "Cryptoassets in the census"
checks = "census_checks"
claim = "core universe"
unit = "assets"
where = "Section 3"

[[headline]]
what = "Of which died"
checks = "census_checks"
claim = "curated deaths"
unit = "assets"
where = "Section 3"

[[headline]]
what = "Death rate of assets that were ever in the top twenty by trading volume, any cause"
checks = "census_checks"
claim = "elite all-cause %"
unit = "percent a year"
where = "Section 3"

[[headline]]
what = "Death rate of those assets by sudden collapse"
checks = "census_checks"
claim = "jump hazard %"
unit = "percent a year"
where = "Section 3"

[[headline]]
what = "Bitcoin's volatility used for May 2026"
checks = "model_checks"
claim = "T4 2026-05 volatility"
unit = "percent a year"
where = "Section 5, Table 4"

[[headline]]
what = "Bitcoin's beta to the US equity market, May 2026"
checks = "model_checks"
claim = "T4 2026-05 beta"
unit = "(a ratio)"
where = "Section 5, Table 4"

[[headline]]
what = "Required return on Bitcoin for a holder with a negligible weight (the floor)"
checks = "model_checks"
claim = "S6 required Bitcoin, diversified holder (w=0)"
low = "S6 required Bitcoin, diversified holder (w=0) 5%"
high = "S6 required Bitcoin, diversified holder (w=0) 95%"
range_is = "90% range"
unit = "percent a year"
where = "Section 6, Table 6"

[[headline]]
what = "Death rate of the smallest quarter of assets by size"
checks = "census_checks"
claim = "size Q1 hazard %"
unit = "percent a year"
where = "Section 3"

[[headline]]
what = "Death rate of the largest quarter of assets by size"
checks = "census_checks"
claim = "size Q4 hazard %"
unit = "percent a year"
where = "Section 3"

[glossary]
"lo, mid, hi" = "lower edge, midpoint and upper edge of the required-return band"
"gap" = "delivered return less required return, in points a year"
"se" = "standard error"
"MC" = "the propagation of the input ranges by random draws (Section 4, Appendix D.1): median and percentiles of the required return"
"T3, T4, T5" = "Tables 3, 4 and 5 of the paper"
"Table 6, S6" = "Table 6 and Section 6: Ether and other cryptoassets"
"S5, S7" = "Sections 5 and 7"
"monthly" = "the monthly test of Section 5: the required return at a month-end against the return of the following month"
"grouping" = "the monthly test with the months grouped in other ways (Appendix D)"
"compound" = "the table of compound returns: the arithmetic required return less the drag of volatility"
"RV, Sharpe, sizing, rebalanced" = "what the required return means for an investor: return per unit of risk, a small rebalanced position, and returns net of the death rate"
"w" = "the share of wealth a holder keeps in the asset, the weight of the concentration term"
"kappa" = "correlation of an asset with the crypto market times market volatility over asset volatility; it scales the crypto share into the asset's weight"
"gamma" = "risk aversion"
"conc" = "the concentration term"
"rf, TNX" = "the risk-free rate; TNX is the ten-year Treasury yield"
"elite" = "an asset that was ever in the top twenty by trading volume"
"jump" = "a sudden collapse, as against a slow death by abandonment or delisting"
"core universe" = "the census after stablecoins, tokenised stocks and wrapped assets are set aside"
"curated" = "deaths after ticker migrations are removed and the known collapses are entered at their public dates"
"exposure" = "asset-years at risk"
"size Q1 to Q4" = "quarters of assets by size, Q1 the smallest"
"n" = "a count of assets, months or windows"
"letter and number prefixes (A.3, D.4, E.4 and so on)" = "an appendix section of the paper. A few follow the numbering of an earlier draft (D.5, D.6, E.2, Fig6) and do not match a section of the current paper; for those, the README's table of scripts says where the result appears"
"age rule" = "the rule of thumb that the expected return falls as one over Bitcoin's age, which the paper compares with the required return"

[live_tool]
name = "Crypto Observatory"
url = "https://apapadogiannis.github.io/crypto-observatory/"
what = "the same equation recomputed each month from live sources, with the differences from this paper's sources stated; guide at https://apapadogiannis.github.io/crypto-observatory/llms.txt"
