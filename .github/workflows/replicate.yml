name: replication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"   # first of each month: catches upstream breakage

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Verify the stored data against its checksums
        run: cd data/cmdata && sha256sum --quiet -c MANIFEST.sha256 && echo "All $(wc -l < MANIFEST.sha256) data files match."

      - name: Regenerate every table and figure
        run: |
          set -o pipefail
          ./run_all.sh 2>&1 | tee run.log

      - name: Verify every audit line is PASS
        run: |
          grep -c "^PASS" run.log
          if grep -q "^CHECK" run.log; then echo "Audit mismatches:"; grep "^CHECK" run.log; exit 1; fi
          if grep -q "^FAIL" run.log; then echo "Model audit mismatches:"; grep "^FAIL" run.log; exit 1; fi

      - name: Verify tables match the committed results
        # Figures embed timestamps; every CSV in outputs/ must be identical.
        run: |
          git diff --exit-code --stat -- 'outputs/*.csv'
          echo "All result tables reproduce byte-for-byte."

      - name: Upload regenerated outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-outputs
          path: |
            outputs/*.csv
            figures/
            run.log
          retention-days: 30
